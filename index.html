<!DOCTYPE html>
<html lang="pt-BR">

<title>Minhas Despesas</title>

<style>
:root{
  color-scheme:light;
  --bg:#f4f4f2;--surface:#fcfcfb;--surface-2:#f0efec;--line:#e2e1dc;
  --text:#0b0b0b;--text-2:#52514e;--muted:#8a8984;
  --accent:#2a78d6;--accent-soft:#cde2fb;--accent-2:#9ec5f4;
  --good:#16833a;--good-bg:#e3f4e8;--warn:#b56d00;--warn-bg:#fdf0d9;--bad:#c93636;--bad-bg:#fbe4e4;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
  --r:12px;
}
@media (prefers-color-scheme:dark){
  :root{color-scheme:dark;
  --bg:#121211;--surface:#1a1a19;--surface-2:#242422;--line:#33332f;
  --text:#f0efec;--text-2:#c3c2b7;--muted:#8d8c84;
  --accent:#3987e5;--accent-soft:#1c3a5e;--accent-2:#2f557f;
  --good:#3bb862;--good-bg:#173323;--warn:#e0a336;--warn-bg:#3a2c12;--bad:#ec6a6a;--bad-bg:#3d1c1c;
  --shadow:none;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:220px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:700;font-size:16px;padding:4px 10px 16px;display:flex;align-items:center;gap:8px}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:inline-grid;place-items:center;color:#fff;font-style:normal;font-size:14px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--text-2);text-decoration:none;font-weight:500;cursor:pointer}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--text)}
.nav svg{width:18px;height:18px;flex:none}
.savebox{margin-top:auto;font-size:12px;color:var(--muted);padding:8px 10px;border-top:1px solid var(--line)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--good)}
.dot.pend{background:var(--warn)}.dot.err{background:var(--bad)}
main{flex:1;min-width:0;padding:22px 26px 90px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:20px;margin:0;flex:1;min-width:160px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.monthpick{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px}
.monthpick button{border:0;background:none;padding:5px 9px;border-radius:7px;cursor:pointer}
.monthpick button:hover{background:var(--surface-2)}
.monthpick span{min-width:96px;text-align:center;font-weight:600}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 12px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 small{font-weight:400;color:var(--muted);margin-left:auto;font-size:12px}
.kpi .lbl{color:var(--text-2);font-size:12.5px;font-weight:500}
.kpi .val{font-size:24px;font-weight:700;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
.up{color:var(--bad)}.down{color:var(--good)}
.two{grid-template-columns:1.6fr 1fr}
.half{grid-template-columns:1fr 1fr}
.chartbox{position:relative;height:260px}
.chartbox.tall{height:320px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;border:0}
.pill.P{background:var(--good-bg);color:var(--good)}
.pill.A{background:var(--warn-bg);color:var(--warn)}
.pill.T{background:var(--bad-bg);color:var(--bad)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters input,.filters select,.fld input,.fld select{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
.filters input[type=search]{flex:1 1 220px}
.summary{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--text-2);margin-bottom:10px}
.summary b{color:var(--text);font-variant-numeric:tabular-nums}
.bulk{display:flex;gap:6px;align-items:center;margin-left:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--text-2);font-weight:600;position:sticky;top:0;background:var(--surface);cursor:pointer;user-select:none;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:hover{background:var(--surface-2)}
.desc{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:12px;color:var(--text-2);background:var(--surface-2);padding:2px 8px;border-radius:6px;white-space:nowrap}
.tablewrap{overflow:auto;max-height:calc(100vh - 260px);border-radius:8px}
.more{text-align:center;padding:12px}
.iconbtn{border:0;background:none;cursor:pointer;padding:4px 6px;border-radius:6px;color:var(--text-2)}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.fat td{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.fat td:first-child,.fat th:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
.fat th{text-align:right}
.cell{cursor:pointer;border-radius:6px;padding:4px 6px;display:inline-flex;gap:5px;align-items:center}
.cell:hover{background:var(--surface-2)}
.cell .s{font-size:11px}
.fat tr.cur td{background:var(--accent-soft)}
.bar{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar > div{height:100%;background:var(--accent);border-radius:999px}
.bar.warn > div{background:var(--warn)}.bar.over > div{background:var(--bad)}.bar.ok > div{background:var(--good)}
.plist{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.pitem .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .m{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-2);margin:6px 0}
.brow{display:grid;grid-template-columns:minmax(120px,1.3fr) 2fr 110px 120px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.brow .n{font-weight:500}
.brow .small{font-size:12px;color:var(--muted)}
.brow input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:right}
.st{font-size:12px;font-weight:600;white-space:nowrap}
.st.ok{color:var(--good)}.st.warn{color:var(--warn)}.st.over{color:var(--bad)}
.muted{color:var(--muted)}
.list-simple{display:grid;gap:2px}
.list-simple .r{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line)}
.list-simple .r .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 12px;overflow:auto}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal.wide{max-width:820px}
.modal h2{margin:0 0 14px;font-size:17px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12px;color:var(--text-2);font-weight:500}
.fld.full{grid-column:1/-1}
.fld input,.fld select{width:100%}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.actions .left{margin-right:auto}
.hint{font-size:12px;color:var(--muted)}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px;display:none}
.fab{display:none}
.chk{width:16px;height:16px;accent-color:var(--accent)}
.empty{padding:30px;text-align:center;color:var(--muted)}
@media (max-width:900px){

  .kpis{grid-template-columns:1fr 1fr}
  .kpi .val{font-size:19px}
  .fab{display:grid;position:fixed;right:16px;bottom:78px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:0;font-size:28px;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:41}
  .top .btn.addtop{display:none}
  .tablewrap{max-height:none}
  table.resp thead{display:none}
  table.resp tr{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:10px 4px;border-bottom:1px solid var(--line)}
  table.resp td{border:0;padding:0}
  table.resp td.c-chk{grid-row:1/4;align-self:center}
  table.resp td.c-desc{grid-column:2;font-weight:600}
  table.resp td.c-desc .desc{max-width:none;white-space:normal}
  table.resp td.c-val{grid-column:3;grid-row:1;font-weight:700}
  table.resp td.c-meta{grid-column:2;font-size:12px;color:var(--text-2)}
  table.resp td.c-st{grid-column:3;grid-row:2;text-align:right}
  table.resp td.c-act{grid-column:3;grid-row:3;text-align:right}
  table.resp td.c-hide{display:none}
  .brow{grid-template-columns:1fr auto 92px;gap:6px 10px}
  .brow .barcell{grid-column:1/-1;order:5}
  .brow:first-child .barcell{display:none}
  .form{grid-template-columns:1fr}
  .bulk{margin-left:0}
  .filters select{flex:1 1 calc(50% - 4px)}

}
@media (min-width:901px){ table.resp td.c-meta{display:none} }

.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{width:100%;max-width:380px;padding:26px}
.login-card .brand{padding:0 0 18px}
.login .fld input{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.mobile-only{display:none}
@media (max-width:900px){.mobile-only{display:block}}

.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--text-2);white-space:nowrap}
.seg button:hover{background:var(--surface-2)}
.seg button.on{background:var(--accent-soft);color:var(--text);font-weight:600}
.perctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.perctl input[type=month]{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 8px}

:root{--alt:#d9822b}
@media (prefers-color-scheme:dark){:root{--alt:#e8a15a}}
.nav .sh{display:none}
.proj{font-size:12.5px}
.proj td,.proj th{min-width:84px}
.proj td:first-child,.proj th:first-child{min-width:190px;max-width:230px;overflow:hidden;text-overflow:ellipsis}
.proj tr.sec td{font-weight:700;font-size:12px;letter-spacing:.04em;color:var(--text-2);background:var(--surface-2)!important;padding-top:12px}
.proj tr.sub td{font-size:11.5px;color:var(--muted);font-weight:600}
.proj tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.proj td.ed,.proj td.lc{cursor:pointer}
.proj td.ed:hover,.proj td.lc:hover{background:var(--accent-soft)}
.proj .cm{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.proj .neg{color:var(--bad)}.proj .pos{color:var(--good)}
.proj .lnk{border:0;background:none;padding:0;cursor:pointer;text-align:left;font:inherit;color:inherit;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj .lnk:hover{text-decoration:underline}
.proj .pg{color:var(--muted)}.proj .pg s{text-decoration-thickness:1px}
.zsw{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2);cursor:pointer;white-space:nowrap}.zsw input{width:auto;margin:0}
.proj .dia{color:var(--muted);margin-right:6px;font-variant-numeric:tabular-nums}
.pjctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pjctl select{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media (max-width:900px){
  .nav .lg{display:none}.nav .sh{display:inline}
  .nav a{font-size:9.5px;padding:6px 1px}

}
</style>

<script>
/* Minhas Despesas — app (HTML/CSS/JS puro + Supabase) */
(function(){
"use strict";

/* ---------- utilidades ---------- */
const fmt=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const brl=v=>fmt.format(v||0);
const brlk=v=>Math.abs(v)>=1000?'R$ '+(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':brl(v);
const MN=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MNF=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const now=new Date();
const CUR=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
const addM=(ym,k)=>{let [y,m]=ym.split('-').map(Number);m+=k;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+'-'+String(m).padStart(2,'0')};
const mLbl=ym=>{const [y,m]=ym.split('-');return MN[+m-1]+'/'+y.slice(2)};

const dLbl=d=>{const [y,m,dd]=d.split('-');return dd+'/'+m+'/'+y.slice(2)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);

const uuid=()=>(crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)}));
const chunk=(a,n)=>{const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o};
const pv=s=>{s=String(s||'').replace(/[R$\s]/g,'');if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return parseFloat(s)||0;};

const STL={P:'Pago',A:'Em aberto',T:'Atrasado'};
const STI={P:'✓',A:'○',T:'!'};

/* Unifica grafias de categoria na importação (mesmas regras usadas na análise da planilha) */
const CATFIX={'saque':'Saque','beleza':'Beleza','lazer':'Lazer','anuidade':'Anuidade','bens duravéis':'Bens Duráveis','cusos':'Cursos','pedagio':'Pedágio','manutenção do veiculo':'Manutenção do Veículo','equipamentos eletronicos':'Equipamentos Eletrônicos','-':'Outros','':'Outros'};
const normCat=c=>{c=String(c??'').replace(/\s+/g,' ').trim();return CATFIX[c.toLowerCase()]??c;};

/* ---------- estado ---------- */
let sb=null, USER=null, rows=[], budgets={}, proj=[], projOk=true, loaded=false;
const cats=()=>uniq(rows.map(r=>r.cat)).sort((a,b)=>a.localeCompare(b,'pt-BR'));
const cards=()=>uniq(rows.map(r=>r.card)).sort();

function fromDb(x){return {id:x.id,d:String(x.data_compra).slice(0,10),desc:x.descricao,cat:x.categoria,tot:+x.valor_total,card:x.cartao,n:x.num_parcelas,p:x.parcela_atual,v:+x.valor_parcela,m:String(x.mes_pagamento).slice(0,7),s:DBST[x.status]||'A',g:x.grupo};}
function toDb(r){return {grupo:r.g,data_compra:r.d,descricao:r.desc,categoria:r.cat,valor_total:r2(r.tot),cartao:r.card,num_parcelas:r.n,parcela_atual:r.p,valor_parcela:Math.round(r.v*1e4)/1e4,mes_pagamento:r.m+'-01',status:STDB[r.s]};}
const COLS={s:'status',desc:'descricao',cat:'categoria',card:'cartao',d:'data_compra',m:'mes_pagamento',v:'valor_parcela'};
function patchDb(p){const o={};for(const k in p){if(k==='s')o.status=STDB[p.s];else if(k==='m')o.mes_pagamento=p.m+'-01';else if(k==='v')o.valor_parcela=Math.round(p.v*1e4)/1e4;else o[COLS[k]]=p[k];}return o;}
const ok=res=>{if(res&&res.error)throw res.error;return res;};

async function loadAll(){
  let all=[],from=0;
  for(;;){const {data}=ok(await sb.from('despesas').select('*').order('id',{ascending:true}).range(from,from+999));all=all.concat(data);if(data.length<1000)break;from+=1000;}
  rows=all.map(fromDb);
  const b=ok(await sb.from('orcamentos').select('*'));budgets={};b.data.forEach(x=>budgets[x.categoria]=+x.limite);
  try{let pa=[],pf=0;for(;;){const {data}=ok(await sb.from('projecao').select('*').order('id',{ascending:true}).range(pf,pf+999));pa=pa.concat(data);if(data.length<1000)break;pf+=1000;}
    proj=pa.map(fromDbP);projOk=true;}catch(e){proj=[];projOk=false;}
  loaded=true;
}
async function reload(){try{await loadAll();}catch(e){toast('Erro ao carregar: '+(e.message||e));}render();}

/* ---------- gravação (otimista: atualiza a tela e depois o banco) ---------- */
let pending=0, saveState='ok';
async function run(fn,msg,reloadAfter){
  pending++;setSave('saving');
  try{await fn();pending--;if(msg)toast(msg);if(reloadAfter)await reload();setSave(pending?'saving':'ok');return true;}
  catch(e){pending--;setSave('err');console.error(e);toast('Erro ao salvar: '+(e.message||e)+' — recarregando dados');await reload();return false;}
}
function updRows(ids,patch,msg){
  const set=new Set(ids);rows.forEach(r=>{if(set.has(r.id))Object.assign(r,patch)});render();

function perRange(){
  const P=UI.per,all=months(),first=all[0]||CUR,last=all[all.length-1]||CUR;
  if(P.mode==='ano')return {from:P.year+'-01',to:P.year+'-12'};
  if(P.mode==='tudo')return {from:first,to:last};
  if(P.mode==='custom'){let a=P.from||first,b=P.to||last;if(a>b){const x=a;a=b;b=x;}return {from:a,to:b};}
  return {from:UI.month,to:UI.month};
}
function perLong(R){const m=UI.per.mode;
  if(m==='mes')return mLong(R.from);
  if(m==='ano')return 'Ano de '+UI.per.year;
  if(m==='tudo')return 'Todo o período ('+mLbl(R.from)+' a '+mLbl(R.to)+')';
  return R.from===R.to?mLong(R.from):mLbl(R.from)+' a '+mLbl(R.to);}
function perShort(R){const m=UI.per.mode;
  if(m==='mes')return mLbl(R.from);
  if(m==='ano')return String(UI.per.year);
  if(m==='tudo')return 'todo o período';
  return R.from===R.to?mLbl(R.from):mLbl(R.from)+' a '+mLbl(R.to);}
function perPicker(){
  const P=UI.per;
  const seg='<div class="seg">'+[['mes','Mês'],['ano','Ano'],['tudo','Todo o período'],['custom','Personalizado']].map(([k,l])=>`<button data-pm="${k}" class="${P.mode===k?'on':''}">${l}</button>`).join('')+'</div>';
  let ctl='';
  if(P.mode==='mes')ctl=monthPicker();
  else if(P.mode==='ano')ctl=`<div class="monthpick"><button data-yk="-1" aria-label="Ano anterior">‹</button><span>${P.year}</span><button data-yk="1" aria-label="Próximo ano">›</button></div>`;
  else if(P.mode==='custom'){const R=perRange();ctl=`<div class="perctl"><input type="month" id="pf" value="${R.from}" aria-label="De"><span class="hint">até</span><input type="month" id="pt" value="${R.to}" aria-label="Até"></div>`;}
  return `<div class="perctl">${seg}${ctl}</div>`;
}
function bindPer(root){
  const P=UI.per;
  root.querySelectorAll('[data-pm]').forEach(b=>b.onclick=()=>{const k=b.dataset.pm;if(k===P.mode)return;
    if(k==='ano')P.year=+UI.month.slice(0,4);

  if(pt)pt.onchange=()=>{if(pt.value){P.to=pt.value;P.from=P.from||pt.value;render();saveUI();}};
}

  bindMonth(v);bindPer(v);bindHeader(v);

  const bm=byMonth();const all=Object.keys(bm).sort();

    const end=all[all.length-1]>addM(M,6)?addM(M,6):all[all.length-1];
    for(let m=start;m<=end;m=addM(m,1))ms.push(m);}

  else document.getElementById('cCard').parentNode.innerHTML='<div class="empty">—</div>';
  const top=[...mr].sort((a,b)=>b.v-a.v).slice(0,8);
  document.getElementById('topList').innerHTML=top.length?top.map(r=>`<div class="r"><span class="grow" title="${esc(r.desc)}">${esc(r.desc)}<br><span class="hint">${esc(r.cat)} · ${esc(r.card)}${r.n>1?' · '+r.p+'/'+r.n:''}</span></span><b class="num">${brl(r.v)}</b></div>`).join(''):'<div class="empty">—</div>';
  const last=[];for(let i=11;i>=0;i--)last.push(addM(TE,-i));
  const tc={};rows.forEach(r=>{if(r.m>=last[0]&&r.m<=TE){tc[r.cat]=tc[r.cat]||{};tc[r.cat][r.m]=(tc[r.cat][r.m]||0)+r.v;}});
  const topc=Object.entries(tc).map(([c,o])=>[c,sum(Object.values(o),x=>x)]).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const mx=Math.max(1,...topc.flatMap(([c])=>last.map(m=>tc[c][m]||0)));
  document.getElementById('catTrend').innerHTML=topc.length?`<div style="overflow:auto"><table class="fat"><thead><tr><th>Categoria</th>${last.map(m=>`<th>${mLbl(m)}</th>`).join('')}<th>Média</th></tr></thead><tbody>${topc.map(([c,t])=>`<tr><td>${esc(c)}</td>${last.map(m=>{const x=tc[c][m]||0;const a=x?0.12+0.78*x/mx:0;return `<td title="${esc(c)} · ${mLong(m)}: ${brl(x)}" style="background:${x?`color-mix(in srgb, var(--accent) ${Math.round(a*100)}%, transparent)`:'transparent'};color:${a>0.55?'#fff':'inherit'};font-size:12px">${x?brlk(x).replace(/R\$\s?/,''):'·'}</td>`}).join('')}<td><b>${brlk(t/12)}</b></td></tr>`).join('')}</tbody></table></div><div class="hint" style="margin-top:6px">Quanto mais escura a célula, maior o gasto. Valores em reais.</div>`:'<div class="empty">—</div>';
}

/* ---------- LANÇAMENTOS ---------- */

  const {k,dir}=UI.sort;
  a.sort((x,y)=>{let A=x[k],B=y[k];if(typeof A==='string')return A.localeCompare(B,'pt-BR')*dir||(y.id-x.id);return (A-B)*dir||(y.id-x.id)});
  return a;
}

/* ---------- PROJEÇÃO ---------- */
const fromDbP=x=>({id:x.id,t:x.tipo,desc:x.descricao,dia:x.dia,m:String(x.mes).slice(0,7),v:+x.valor,pg:!!x.pago});
const toDbP=r=>({tipo:r.t,descricao:r.desc,dia:r.dia||null,mes:r.m+'-01',valor:r2(r.v),pago:!!r.pg});
const numf=v=>v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
let PV={rec:[],prev:[],lanc:[],MS:[]};
function projMonths(){const P=UI.pj,s=P.start||CUR,a=[];for(let i=0;i<P.n;i++)a.push(addM(s,i));return a;}
function groupProj(t,z){const g={};proj.filter(x=>x.t===t).forEach(x=>{const o=g[x.desc]||(g[x.desc]={desc:x.desc,dia:x.dia,vals:{},raw:{},pg:{}});o.raw[x.m]=(o.raw[x.m]||0)+x.v;o.pg[x.m]=!!x.pg;o.vals[x.m]=(z&&x.pg)?0:o.raw[x.m];if(x.dia&&!o.dia)o.dia=x.dia;});
  return Object.values(g).sort((a,b)=>(a.dia||99)-(b.dia||99)||a.desc.localeCompare(b.desc,'pt-BR'));}
function vProj(){
  const v=document.getElementById('view');const P=UI.pj;
  const ctrl=(extra)=>`<div class="top"><h1>Projeção</h1>${extra||''}</div>`;
  if(!projOk){v.innerHTML=ctrl()+`<div class="card"><h3>Falta criar a tabela da projeção</h3><p class="hint" style="margin-top:0">Rode o arquivo <b>schema.sql</b> atualizado no SQL Editor do Supabase (ele só acrescenta a tabela nova, não mexe nos seus lançamentos) e recarregue esta página.</p></div>`;return;}
  const MS=projMonths(),first=MS[0],last=MS[MS.length-1];
  const Z=P.z!==false;
  const rec=groupProj('R',Z),prev=groupProj('D',Z);
  const lm={};rows.forEach(r=>{if(r.m>=first&&r.m<=last){const o=lm[r.card]||(lm[r.card]={desc:r.card,vals:{},raw:{}});o.raw[r.m]=(o.raw[r.m]||0)+r.v;o.vals[r.m]=(o.vals[r.m]||0)+((Z&&r.s==='P')?0:r.v);}});
  const lanc=Object.values(lm).sort((a,b)=>sum(Object.values(b.raw),x=>x)-sum(Object.values(a.raw),x=>x));
  const zR=sum(rec,g=>sum(MS,m=>g.raw[m]||0)-sum(MS,m=>g.vals[m]||0));
  const zD=sum(lanc,g=>sum(MS,m=>g.raw[m]||0)-sum(MS,m=>g.vals[m]||0))+sum(prev,g=>sum(MS,m=>g.raw[m]||0)-sum(MS,m=>g.vals[m]||0));
  const col=(arr,m)=>sum(arr,x=>x.vals[m]||0);
  const tR=MS.map(m=>col(rec,m)),tL=MS.map(m=>col(lanc,m)),tP=MS.map(m=>col(prev,m));
  const tD=MS.map((m,i)=>tL[i]+tP[i]),sal=MS.map((m,i)=>tR[i]-tD[i]);
  let acc=0;const ac=sal.map(x=>acc+=x);
  PV={rec,prev,lanc,MS,tR,tL,tP,tD,sal,ac};
  const sR=sum(tR,x=>x),sD=sum(tD,x=>x),sS=sR-sD;
  const neg=MS.filter((m,i)=>sal[i]<0);
  const sgn=x=>`<span class="${x<0?'up':'down'}">${x<0?'−':''}${brl(Math.abs(x))}</span>`;
  const head=`<div class="pjctl"><div class="monthpick"><button data-ps="-1" aria-label="Mês anterior">‹</button><span style="min-width:128px">${mLbl(first)} a ${mLbl(last)}</span><button data-ps="1" aria-label="Próximo mês">›</button><button data-ps="0" style="font-size:12px">Hoje</button></div>
   <select id="pj-n" aria-label="Quantidade de meses">${[6,12,18,24,36].map(n=>`<option value="${n}" ${P.n===n?'selected':''}>${n} meses</option>`).join('')}</select>
   <label class="zsw" title="Quando ligado, despesas com status Pago e itens marcados como recebidos/pagos saem das somas (ficam riscados com ✓)"><input type="checkbox" id="pj-z" ${Z?'checked':''}> Zerar pagos/recebidos</label>
   <button class="btn" id="pj-ar">+ Receita</button><button class="btn" id="pj-ad">+ Despesa prevista</button></div>`;
  const cl=(m)=>m===CUR?'cm ':'';
  const num=x=>x?numf(x):'<span class="muted">–</span>';
  const erow=(arr,tp)=>arr.map((g,gi)=>`<tr><td><button class="lnk" data-eit="${tp}|${gi}" title="Editar ou excluir este item">${g.dia?`<span class="dia">${g.dia}</span>`:''}${esc(g.desc)}</button></td>${MS.map(m=>{const rw=g.raw[m]||0,z0=Z&&g.pg[m]&&rw;return `<td class="${cl(m)}ed" data-ed="${tp}|${gi}|${m}" title="${z0?(tp==='R'?'Recebido':'Pago')+' — zerado nas somas. ':''}Clique para editar ${esc(mLbl(m))}">${z0?`<span class="pg">✓ <s>${numf(rw)}</s></span>`:num(g.vals[m]||0)}</td>`}).join('')}</tr>`).join('');
  const lrow=lanc.map((g,gi)=>`<tr><td title="Vem dos seus lançamentos">${esc(g.desc)}</td>${MS.map(m=>{const x=g.vals[m]||0,rw=g.raw[m]||0;return `<td class="${cl(m)}${rw?'lc':''}" ${rw?`data-lc="${gi}|${m}" title="${x<rw-0.004?(x?'Parte já paga (zerada). ':'Tudo pago — zerado. ')+'Total da fatura: '+brl(rw)+'. ':''}Ver a fatura"`:''}>${rw&&!x?`<span class="pg">✓ <s>${numf(rw)}</s></span>`:num(x)}</td>`}).join('')}</tr>`).join('');
  const trow=(label,arr,cls)=>`<tr class="tot"><td>${label}</td>${arr.map((x,i)=>`<td class="${cl(MS[i])}${cls?(x<0?'neg':'pos'):''}">${numf(x)}</td>`).join('')}</tr>`;
  v.innerHTML=ctrl(head)+`
  <div class="grid kpis">
   <div class="card kpi"><div class="lbl">Receitas previstas</div><div class="val">${brl(sR)}</div><div class="sub">${mLbl(first)} a ${mLbl(last)} · ${MS.length} meses${Z&&zR?' · '+brl(zR)+' já recebido (zerado)':''}</div></div>

/* grava itens da projeção (otimista) */
function applyProj(tp,desc,dia,months,val,msg,pago){
  const set=new Set(months);
  const was={};proj.forEach(x=>{if(x.t===tp&&x.desc===desc&&set.has(x.m))was[x.m]=!!x.pg;});
  const pg=m=>pago===undefined?!!was[m]:!!pago;
  proj=proj.filter(x=>!(x.t===tp&&x.desc===desc&&set.has(x.m)));
  if(val>0)months.forEach(m=>proj.push({id:-Date.now()-Math.random(),t:tp,desc,dia:dia||null,m,v:val,pg:pg(m)}));
  render();
  return run(async()=>{
    for(const c of chunk(months.map(m=>m+'-01'),200))ok(await sb.from('projecao').delete().eq('tipo',tp).eq('descricao',desc).in('mes',c));
    if(val>0)for(const c of chunk(months,200))ok(await sb.from('projecao').insert(c.map(m=>Object.assign({user_id:USER.id},toDbP({t:tp,desc,dia,m,v:val,pg:pg(m)})))));
  },msg||'Projeção atualizada');
}
function monthsBetween(a,b){if(b<a)b=a;const l=[];for(let x=a;x<=b&&l.length<120;x=addM(x,1))l.push(x);return l;}

  modal(`<h2>${esc(g.desc)} · ${mLong(m)}</h2><form class="form" id="fce" style="grid-template-columns:1fr">
   <div class="fld"><label>Valor (R$) — vazio ou 0 remove o valor</label><input id="ce-v" inputmode="decimal" value="${cur?numf(cur):''}"></div>
   <div class="fld"><label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" id="ce-pg" ${curPg?'checked':''} style="width:auto"> ${tp==='R'?'Já recebido':'Já pago'} <span class="hint">(zera nas somas)</span></label></div>
   <div class="fld"><label>Aplicar em</label><select id="ce-r"><option value="one">Só ${mLbl(m)}</option><option value="end">${mLbl(m)} até ${mLbl(last)} (fim do quadro)</option><option value="custom">${mLbl(m)} até um mês que eu escolher</option></select></div>
   <div class="fld" id="ce-w" style="display:none"><label>Até o mês</label><input id="ce-to" type="month" value="${last}"></div>

    const to=r==='one'?m:r==='end'?last:(q('ce-to').value||m);const pgv=q('ce-pg').checked;closeModal();applyProj(tp,g.desc,g.dia,monthsBetween(m,to),r2(val),undefined,pgv===curPg?undefined:pgv);};

function openProjItem(tp,gi){

function exportProj(){
  if(typeof XLSX==='undefined'){toast('Biblioteca de planilha não carregou.');return;}
  const {MS,rec,prev,lanc,tR,tD,sal,ac}=PV;const L=g=>[(g.dia?g.dia+' · ':'')+g.desc,...MS.map(m=>g.vals[m]||0)];
  const aoa=[['PROJEÇÃO',...MS.map(mLbl)],['RECEITAS'],...rec.map(L),['TOTAL (R)',...tR],[],['DESPESAS'],['Lançadas no sistema (por cartão)'],...lanc.map(L),['Previstas'],...prev.map(L),['TOTAL (D)',...tD],[],['SALDO (R − D)',...sal],['ACUMULADO',...ac]];
  const ws=XLSX.utils.aoa_to_sheet(aoa);Object.keys(ws).forEach(k=>{if(k[0]!=='!'&&ws[k].t==='n')ws[k].z='#,##0.00';});
  ws['!cols']=[{wch:34},...MS.map(()=>({wch:12}))];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Projeção');
  download(new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'projecao.xlsx');
}

function openPw(){

   <div class="hint" id="pwmsg" style="color:var(--bad)"></div>
   <div class="actions"><button type="button" class="btn" data-x>Cancelar</button><button class="btn pri" type="submit">Salvar nova senha</button></div></form>`);
  document.querySelector('#modal [data-x]').onclick=closeModal;
  document.getElementById('fpw').onsubmit=async e=>{e.preventDefault();
    const p1=document.getElementById('pw1').value,p2=document.getElementById('pw2').value,msg=document.getElementById('pwmsg');
    const kinds=[/[a-z]/,/[A-Z]/,/\d/,/[^A-Za-z0-9]/].filter(r=>r.test(p1)).length;
    if(p1.length<12){msg.textContent='A senha precisa ter pelo menos 12 caracteres.';return;}
    if(kinds<3){msg.textContent='Misture pelo menos 3 tipos: maiúsculas, minúsculas, números e símbolos.';return;}
    if(p1!==p2){msg.textContent='As duas senhas não são iguais.';return;}
    const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='Salvando…';

}

    closeModal();
    let n=0;rows.forEach(r=>{if(r[field]===old){r[field]=nv;n++}});
    const col=COLS[field];const bOld=budgets[old];
    if(field==='cat'&&bOld!=null){if(budgets[nv]==null)budgets[nv]=bOld;delete budgets[old];}
    render();
    run(async()=>{ok(await sb.from('despesas').update({[col]:nv}).eq(col,old));
      if(field==='cat'&&bOld!=null){ok(await sb.from('orcamentos').upsert({categoria:nv,limite:budgets[nv]},{onConflict:'user_id,categoria'}));ok(await sb.from('orcamentos').delete().eq('categoria',old));}},n+' lançamentos atualizados');};
}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);}
function exportX(list,name){
  if(typeof XLSX==='undefined'){toast('Biblioteca de planilha não carregou.');return;}
  const data=[['DATA','DESCRIÇÃO','CATEGORIA','VALOR TOTAL','CARTÃO UTILIZADO','Nº DE PARCELA','PARCELA ATUAL','VALOR PARCELA','MÊS DE PGTO','STATUS']];
  [...list].sort((a,b)=>a.m.localeCompare(b.m)||a.d.localeCompare(b.d)).forEach(r=>data.push([new Date(r.d+'T12:00:00'),r.desc,r.cat,r.tot,r.card,r.n,r.p,r2(r.v),new Date(r.m+'-01T12:00:00'),STDB[r.s]]));
  const ws=XLSX.utils.aoa_to_sheet(data,{cellDates:true});
  for(let i=2;i<=data.length;i++){if(ws['A'+i])ws['A'+i].z='dd/mm/yyyy';if(ws['I'+i])ws['I'+i].z='mmm/yyyy';['D','H'].forEach(c=>{if(ws[c+i])ws[c+i].z='"R$" #,##0.00'})}
  ws['!cols']=[{wch:11},{wch:45},{wch:20},{wch:13},{wch:16},{wch:8},{wch:8},{wch:13},{wch:11},{wch:11}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Despesas Gerais');
  download(new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),name);
}
const rowKey=r=>[r.d,r.desc,r2(r.v),r.m,r.p].join('|');
function importFile(file){
  const msg=document.getElementById('imsg');if(!file)return;
  const fr=new FileReader();
  fr.onload=()=>{try{
    let add=[],skip=0,bud=null,pjb=null;
    /* compara por quantidade: compras idênticas no mesmo dia são mantidas */
    const cnt=new Map();rows.forEach(r=>{const k=rowKey(r);cnt.set(k,(cnt.get(k)||0)+1)});
    const exists=r=>{const k=rowKey(r),c=cnt.get(k)||0;if(c>0){cnt.set(k,c-1);return true}return false};
    if(/\.json$/i.test(file.name)){
      const j=JSON.parse(new TextDecoder().decode(fr.result));
      (j.despesas||[]).forEach(x=>{const r=fromDb(x);if(exists(r)){skip++;return}add.push(r);});
      bud=j.orcamentos||null;pjb=Array.isArray(j.projecao)&&j.projecao.length?j.projecao.map(x=>({t:x.tipo,desc:x.descricao,dia:x.dia,m:String(x.mes).slice(0,7),v:+x.valor,pg:!!x.pago})):null;
    }else{
      if(typeof XLSX==='undefined')throw new Error('biblioteca de planilha não carregou');
      const wb=XLSX.read(new Uint8Array(fr.result),{type:'array',cellDates:true});
      const ws=wb.Sheets['Despesas Gerais']||wb.Sheets[wb.SheetNames[0]];
      const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true});
      const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().trim();
      const h=aoa.findIndex(r=>r&&r.some(c=>norm(c)==='DESCRICAO'));if(h<0)throw new Error('cabeçalho DESCRIÇÃO não encontrado');
      const H=aoa[h].map(norm);const ix=k=>H.findIndex(c=>c.startsWith(k));
      const I={d:ix('DATA'),desc:ix('DESCRICAO'),cat:ix('CATEGORIA'),tot:ix('VALOR TOTAL'),card:ix('CARTAO'),n:ix('N'),p:ix('PARCELA ATUAL'),v:ix('VALOR PARCELA'),m:ix('MES'),s:ix('STATUS')};
      const toD=x=>{if(x instanceof Date)return new Date(x.getTime()+43200000).toISOString().slice(0,10);if(typeof x==='number'){return new Date(Date.UTC(1899,11,30)+x*864e5).toISOString().slice(0,10)}const m=String(x||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(m)return (m[3].length===2?'20'+m[3]:m[3])+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return null};
      const gm={};
      for(const a of aoa.slice(h+1)){if(!a||!a[I.desc])continue;const d=toD(a[I.d]);if(!d)continue;
        const tot=+a[I.tot]||0,n=Math.max(1,+a[I.n]||1),p=Math.max(1,+a[I.p]||1);
        const v=I.v>=0&&typeof a[I.v]==='number'?a[I.v]:tot/n;
        const md=toD(a[I.m]);const m=md?md.slice(0,7):d.slice(0,7);const st=norm(a[I.s]);
        const r={d,desc:String(a[I.desc]).replace(/\s+/g,' ').trim(),cat:normCat(a[I.cat]),tot,card:String(a[I.card]||'OUTRO').trim().toUpperCase(),n,p,v,m,s:st.startsWith('PAGO')?'P':st.startsWith('ATRAS')?'T':'A'};
        if(exists(r)){skip++;continue}
        const gk=n>1?[r.d,r.desc,r.tot,r.card,r.n].join('|'):Math.random();r.g=gm[gk]||(gm[gk]=uuid());add.push(r);}
    }
    if(!add.length&&!bud&&!pjb){msg.textContent='Nenhuma linha nova encontrada ('+skip+' já existiam).';return;}
    confirmBox(`Importar ${add.length} lançamentos novos?`,`${skip} linhas já existiam e serão ignoradas. Total importado: ${brl(sum(add,r=>r.v))}.${bud?' Os limites de orçamento do backup também serão restaurados.':''}${pjb?' A projeção (receitas e despesas previstas) também será restaurada.':''}`,'Importar',async()=>{
      msg.textContent='Importando…';
      const okIns=add.length?await insRows(add,add.length+' lançamentos importados'):true;
      if(bud)await run(async()=>{const list=Object.entries(bud).filter(([,l])=>+l>0).map(([categoria,limite])=>({categoria,limite:+limite}));if(list.length)ok(await sb.from('orcamentos').upsert(list,{onConflict:'user_id,categoria'}));},'Orçamento restaurado',true);
      if(pjb&&projOk)await run(async()=>{for(const c of chunk(pjb,500))ok(await sb.from('projecao').upsert(c.map(x=>Object.assign({user_id:USER.id},toDbP(x))),{onConflict:'user_id,tipo,descricao,mes'}));},'Projeção restaurada',true);
      const el=document.getElementById('imsg');if(el)el.textContent=okIns?'Importação concluída.':'A importação falhou — veja a mensagem de erro.';
    });
  }catch(e){msg.textContent='Não consegui ler o arquivo: '+e.message;}};
  fr.readAsArrayBuffer(file);
}

/* ---------- modais ---------- */
function modal(html,wide){const m=document.getElementById('modal');m.className='modal'+(wide?' wide':'');m.innerHTML=html;document.getElementById('mbg').classList.add('show');const f=m.querySelector('input:not([type=checkbox]),select');if(f&&window.innerWidth>900)setTimeout(()=>f.focus(),30);}
function closeModal(){const b=document.getElementById('mbg');if(b)b.classList.remove('show');}
function confirmBox(title,text,okLbl,fn){modal(`<h2>${esc(title)}</h2><p class="hint" style="font-size:13.5px">${esc(text)}</p><div class="actions"><button class="btn" data-x>Cancelar</button><button class="btn ${okLbl==='Excluir'?'danger':'pri'}" id="cok">${esc(okLbl)}</button></div>`);
  document.querySelector('#modal [data-x]').onclick=closeModal;document.getElementById('cok').onclick=()=>{closeModal();fn()};}
function lastCard(){const r=[...rows].sort((a,b)=>b.d.localeCompare(a.d))[0];return r?r.card:''}
function openNew(){
  const today=new Date(now.getTime()-now.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  modal(`<h2>Nova despesa</h2><form class="form" id="fnew">
   <div class="fld full"><label>Descrição</label><input id="n-desc" required placeholder="Ex.: Mercado Dia"></div>
   <div class="fld"><label>Valor total (R$)</label><input id="n-tot" inputmode="decimal" required placeholder="0,00"></div>
   <div class="fld"><label>Data da compra</label><input id="n-d" type="date" value="${today}" required></div>
   <div class="fld"><label>Categoria</label><input id="n-cat" list="dl-cat" required></div>
   <div class="fld"><label>Cartão / forma</label><input id="n-card" list="dl-card" value="${esc(lastCard())}" required></div>
   <div class="fld"><label>Nº de parcelas</label><input id="n-n" type="number" min="1" max="120" value="1"></div>
   <div class="fld"><label>1ª parcela paga em</label><input id="n-m" type="month" value="${addM(CUR,1)}"></div>
   <div class="fld"><label>Status</label><select id="n-s"><option value="A">Em aberto</option><option value="P">Pago</option></select></div>
   <div class="fld full hint" id="n-prev"></div>
   <div class="actions full" style="grid-column:1/-1"><button type="button" class="btn" data-x>Cancelar</button><button class="btn pri" type="submit">Adicionar</button></div></form>`);
  const q=id=>document.getElementById(id);
  const prev=()=>{const t=pv(q('n-tot').value),n=Math.max(1,+q('n-n').value||1);q('n-prev').textContent=t?(n>1?`${n}x de ${brl(t/n)} — de ${mLbl(q('n-m').value||CUR)} a ${mLbl(addM(q('n-m').value||CUR,n-1))}`:`À vista: ${brl(t)} em ${mLbl(q('n-m').value||CUR)}`):'';};
  ['n-tot','n-n','n-m'].forEach(i=>q(i).oninput=prev);
  q('n-card').onchange=()=>{if(q('n-card').value.toUpperCase()==='DINHEIRO'){q('n-m').value=q('n-d').value.slice(0,7);q('n-s').value='P';prev();}};
  document.querySelector('#modal [data-x]').onclick=closeModal;
  q('fnew').onsubmit=e=>{e.preventDefault();const t=pv(q('n-tot').value);if(!(t>0)){q('n-tot').focus();return;}
    const n=Math.max(1,Math.min(120,+q('n-n').value||1));const g=uuid();const m0=q('n-m').value||CUR;const list=[];
    for(let p=1;p<=n;p++)list.push({d:q('n-d').value,desc:q('n-desc').value.trim(),cat:normCat(q('n-cat').value),tot:r2(t),card:q('n-card').value.trim().toUpperCase(),n,p,v:t/n,m:addM(m0,p-1),s:q('n-s').value,g});
    closeModal();insRows(list,n>1?`Despesa adicionada em ${n} parcelas`:'Despesa adicionada');};
}
function openEdit(id){
  const r=rows.find(x=>x.id===id);if(!r)return;const grp=rows.filter(x=>x.g===r.g);
  modal(`<h2>Editar lançamento</h2><form class="form" id="fed">
   <div class="fld full"><label>Descrição</label><input id="e-desc" value="${esc(r.desc)}"></div>
   <div class="fld"><label>Categoria</label><input id="e-cat" list="dl-cat" value="${esc(r.cat)}"></div>
   <div class="fld"><label>Cartão / forma</label><input id="e-card" list="dl-card" value="${esc(r.card)}"></div>
   <div class="fld"><label>Data da compra</label><input id="e-d" type="date" value="${r.d}"></div>
   <div class="fld"><label>Mês de pagamento</label><input id="e-m" type="month" value="${r.m}"></div>
   <div class="fld"><label>Valor desta parcela (R$)</label><input id="e-v" inputmode="decimal" value="${r2(r.v).toFixed(2).replace('.',',')}"></div>
   <div class="fld"><label>Status</label><select id="e-s">${Object.entries(STL).map(([k,l])=>`<option value="${k}" ${r.s===k?'selected':''}>${l}</option>`).join('')}</select></div>
   <div class="fld full hint">${r.n>1?`Parcela ${r.p} de ${r.n} · valor total ${brl(r.tot)}`:'Compra à vista'}</div>
   ${grp.length>1?`<label class="fld full" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" class="chk" id="e-all" checked> <span>Aplicar descrição, categoria e cartão às ${grp.length} parcelas desta compra</span></label>`:''}
   <div class="actions full" style="grid-column:1/-1"><button type="button" class="btn danger left" id="e-del">Excluir…</button><button type="button" class="btn" data-x>Cancelar</button><button class="btn pri" type="submit">Salvar</button></div></form>`);
  const q=id=>document.getElementById(id);
  document.querySelector('#modal [data-x]').onclick=closeModal;
  q('fed').onsubmit=async e=>{e.preventDefault();const all=q('e-all')&&q('e-all').checked;
    const common={desc:q('e-desc').value.trim()||r.desc,cat:normCat(q('e-cat').value)||r.cat,card:q('e-card').value.trim().toUpperCase()||r.card};
    const own={d:q('e-d').value||r.d,m:q('e-m').value||r.m,s:q('e-s').value};const v=pv(q('e-v').value);if(v>0&&Math.abs(v-r.v)>0.004)own.v=v;
    closeModal();
    if(all){await updRows(grp.map(x=>x.id),common);await updRows([r.id],own,'Lançamento atualizado');}
    else updRows([r.id],Object.assign(common,own),'Lançamento atualizado');};
  q('e-del').onclick=()=>{
    modal(`<h2>Excluir</h2><p class="hint" style="font-size:13.5px">${esc(r.desc)}</p><div class="actions"><button class="btn" data-x>Cancelar</button>${grp.length>1?`<button class="btn danger" id="d-all">Excluir a compra inteira (${grp.length} parcelas)</button>`:''}<button class="btn danger" id="d-one">Excluir ${grp.length>1?'só esta parcela':'lançamento'}</button></div>`);
    document.querySelector('#modal [data-x]').onclick=closeModal;
    q('d-one').onclick=()=>{closeModal();delRows([r.id],'Lançamento excluído')};
    if(q('d-all'))q('d-all').onclick=()=>{closeModal();delRows(grp.map(x=>x.id),grp.length+' parcelas excluídas')};
  };
}

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>render());
start();
})();
